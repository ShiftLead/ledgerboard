name: ci
# The merge gate is the local precheck (docs/cadence.toml's `precheck`, run by
# `agent-cadence run precheck.py --pr <n>`, TD-003): the account's repos share one pool of Actions
# minutes. This workflow runs on a PR from a fork, whose code then runs in GitHub's sandbox rather
# than on a machine; on a release tag, whose module must carry its header; and by hand. A PR from
# this repo skips the job: the precheck already runs the same checks.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff && ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python fixtures/run.py
      - name: a tag's module carries its release header, intact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python fixtures/run.py --check-header
          head -1 ledgerboard.py | grep -q "^# ledgerboard ${GITHUB_REF_NAME} sha256:"
