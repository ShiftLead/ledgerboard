name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff && ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python fixtures/run.py
      - name: a tag's module carries its release header, intact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python fixtures/run.py --check-header
          head -1 ledgerboard.py | grep -q "^# ledgerboard ${GITHUB_REF_NAME} sha256:"
