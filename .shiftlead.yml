# ShiftLead's definition of this repo's team (ShiftLead design §4.9). Set up 2026-10-31 on Paul's
# go, to build entries as they become pickable: the builds his design conversations release.
#
# The flow is `td` (Paul, 2026-10-31): design → build → review. The designer takes only entries
# marked `**Kind:** design-first` (or blocked on `decision (designer)`); every other pickable entry
# is the grinder's, so an entry already designed in conversation skips the designer by carrying no
# Kind. The techlead's review stage reads every PR on a `held:` path and merges it for an
# unattended author. A release (stamp and tag) stays Paul's: the consumers vendor tags only.
# The team's own rules are not held: a PR touching them is left for Paul (the grinder brief).
held: ["ledgerboard.py", "SPEC.md", "fixtures/**", "release.sh", "tests/**"]

# The repo's whole check (AGENTS.md *Commands*); stdlib only, so a fresh worktree needs nothing.
commands:
  test: python3 -m unittest discover -s tests && python3 fixtures/run.py
  lint: ruff check .

# A new worktree is set up by the pinned agent-cadence's hydrate (its memory path), as
# samscrape's is: the launcher from PATH, else where its install puts it.
worktree_setup: 'dev=$(command -v agent-cadence || echo "$HOME/.local/bin/agent-cadence"); "$dev" run hydrate_worktree.sh "$1"'

teams:
  lb-grind:
    flows: [td, build-review, build]
    manager:
      role: manager
      name: lb-manager
      brief: docs/briefs/manager-lb-1.md
    # Filled on demand for one batch of questions, reading the primer first (design §4.9b).
    techlead: {name: lb-techlead, context: docs/briefs/techlead-context.md}
    members:
      - role: grinder
        name: lb-grinder
        lane: free-pick
        brief: docs/briefs/grinder-lb-1.md
      - role: designer
        name: lb-designer
        brief: docs/briefs/designer-lb-1.md
